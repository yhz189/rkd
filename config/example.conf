# rkd 配置文件示例
# 格式：进程名=启动命令,最大重启次数,重启延迟秒数
# - 以 # 开头的行为注释
# - 最大重启次数设为 -1 表示无限重启
# - 重启延迟单位为秒，建议不小于1

# 测试用 sleep 进程（/bin/sleep 在所有 Linux 系统上都存在）
test_sleep=/bin/sleep 30,3,2

# Nginx 示例
# nginx=/usr/sbin/nginx -g "daemon off;",10,3

# 自定义应用示例
# myapp=/root/myapp/app,5,1

# 无限重启示例
# watchdog=/usr/bin/watchdog,-1,2
